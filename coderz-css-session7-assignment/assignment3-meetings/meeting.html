<!doctype html>
<html lang="ar" dir="rtl">
  <head>

    <title>مواعيد اللقاءات</title>
    <link rel="stylesheet" href="meeting.css" />
  </head>
  <body>
    <div id="main-container">
      <div id="page-header">
        <h1 id="main-title">مواعيد اللقاءات</h1>
        <h3 id="sub-title">تابع لقاءاتك القادمة واستعد للتطبيق.</h3>

      <div id="meeting-card-1">
        <h5 id="status-1">اللقاء القادم</h5>

          <button id="details-btn-1">تفاصيل اللقاء</button>
        </div>
      </div>

      <div id="meeting-card-2">

        <h1 id="title-2">تنسيق الصفحات باستخدام CSS</h1>
        <h3 class="secondary-text">ننشّق النصوص والألوان ونضبط المسافات.</h3>
        <h3 class="secondary-text">الاثنين - 5:00 مساءً</h3>
        <div>
          <button id="details-btn-2">تفاصيل اللقاء</button>
        </div>
      </div>
    </div>
